<!-- 校園攻略站 Loader -->
<div id="campus-guide-loader" style="position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:var(--alice); font-family:'Zen Kaku Gothic New','Noto Sans TC',sans-serif; --dur:7.2s">
  <style>
    @keyframes pinDrop {
      0%, 100% { transform: translateY(0) scale(1,1); }
      3%  { transform: translateY(-24px) scale(.94,1.06); }
      7%  { transform: translateY(0) scale(1.12,.88); }
      10% { transform: translateY(-6px) scale(.98,1.02); }
      14% { transform: translateY(0) scale(1,1); }
    }
    @keyframes signSwing {
      0%, 100% { transform: rotate(0deg); }
      3%  { transform: rotate(-11deg); }
      7%  { transform: rotate(9deg); }
      11% { transform: rotate(-5deg); }
      14% { transform: rotate(0deg); }
    }
    @keyframes stir {
      0%, 100% { transform: rotate(10deg) translateX(0); }
      4%  { transform: rotate(-12deg) translateX(-3px); }
      8%  { transform: rotate(14deg) translateX(3px); }
      11% { transform: rotate(-8deg) translateX(-3px); }
      14% { transform: rotate(10deg) translateX(0); }
    }
    @keyframes swirl {
      0%, 100% { transform: translateX(0) scaleY(1); }
      5%  { transform: translateX(-3px) scaleY(1.15); }
      10% { transform: translateX(3px) scaleY(.9); }
    }
    @keyframes cardFlip {
      0%  { transform: rotateY(0deg) translateY(0); }
      1.5% { transform: rotateY(-90deg) translateY(-5px); }
      3%  { transform: rotateY(-180deg) translateY(-5px); }
      4.5% { transform: rotateY(-270deg) translateY(-3px); }
      6%, 100% { transform: rotateY(-360deg) translateY(0); }
    }
    @keyframes windowOn {
      0%, 100% { background: var(--line); }
      5%, 12%  { background: var(--cream); }
    }
    @keyframes housePulse {
      0%, 100% { transform: translateY(0); }
      6% { transform: translateY(-4px); }
    }
    @keyframes bagHop {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      3%  { transform: translateY(-12px) rotate(-6deg); }
      6%  { transform: translateY(0) rotate(0deg); }
      9%  { transform: translateY(-7px) rotate(5deg); }
      13% { transform: translateY(0) rotate(0deg); }
    }
    @keyframes strapSway {
      0%, 100% { transform: rotate(0deg); }
      4% { transform: rotate(-8deg); }
      10% { transform: rotate(6deg); }
    }
    @keyframes dash {
      0% { background-position: 0 0; } 100% { background-position: 14px 0; }
    }
  </style>

  <div style="display:flex; flex-direction:column; align-items:center; gap:24px">
    <div style="position:relative; width:300px; height:98px; display:flex; align-items:flex-end; justify-content:center; gap:12px; padding:0 8px 14px">
      <div style="position:absolute; left:0; right:0; bottom:8px; height:1.5px; border-radius:1px; background:repeating-linear-gradient(90deg, var(--line) 0 7px, transparent 7px 14px); background-size:14px 100%; animation:dash 1.1s linear infinite"></div>

      <div style="position:relative; width:27px; height:38px">
        <div style="position:absolute; left:0; right:0; top:0; height:31px; transform-origin:bottom center; animation:pinDrop var(--dur) infinite cubic-bezier(.4,0,.2,1); animation-delay:0s">
          <div style="position:absolute; left:1px; top:0; width:25px; height:25px; background:var(--navy); border-radius:50% 50% 50% 0; transform:rotate(-45deg)">
            <div style="position:absolute; left:7px; top:7px; width:11px; height:11px; border-radius:50%; background:var(--cream)"></div>
          </div>
        </div>
        <div style="position:absolute; left:8px; bottom:0; width:11px; height:4px; border-radius:50%; background:var(--aqua)"></div>
      </div>

      <div style="position:relative; width:37px; height:63px; transform-origin:bottom center; animation:signSwing var(--dur) infinite cubic-bezier(.4,0,.2,1); animation-delay:calc(var(--dur) * 0.08)">
        <div style="position:absolute; left:17px; top:5px; width:3px; height:58px; background:var(--navy); border-radius:1px"></div>
        <div style="position:absolute; left:3px; top:5px; width:31px; height:11px; background:var(--cream); clip-path:polygon(0 0, 82% 0, 100% 50%, 82% 100%, 0 100%)"></div>
        <div style="position:absolute; left:5px; top:23px; width:29px; height:11px; background:var(--aqua); clip-path:polygon(18% 0, 100% 0, 100% 100%, 18% 100%, 0 50%)"></div>
        <div style="position:absolute; left:10px; bottom:0; width:17px; height:4px; background:var(--navy); border-radius:2px"></div>
      </div>

      <div style="position:relative; width:36px; height:45px; perspective:220px">
        <div style="position:absolute; inset:0; transform-style:preserve-3d; animation:cardFlip var(--dur) infinite cubic-bezier(.4,0,.2,1); animation-delay:calc(var(--dur) * 0.20)">
          <div style="position:absolute; left:8px; top:-3px; width:3px; height:8px; border-radius:1px; background:var(--mid); backface-visibility:hidden"></div>
          <div style="position:absolute; right:8px; top:-3px; width:3px; height:8px; border-radius:1px; background:var(--mid); backface-visibility:hidden"></div>
          <div style="position:absolute; inset:0; background:var(--card); border:2px solid var(--navy); border-radius:5px; overflow:hidden; backface-visibility:hidden">
            <div style="height:11px; background:var(--navy)"></div>
            <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:2px; padding:4px 4px 0">
              <div style="height:5px; border-radius:1px; background:var(--aqua)"></div>
              <div style="height:5px; border-radius:1px; background:var(--line)"></div>
              <div style="height:5px; border-radius:1px; background:var(--mid)"></div>
              <div style="height:5px; border-radius:1px; background:var(--line)"></div>
              <div style="height:5px; border-radius:1px; background:var(--aqua)"></div>
              <div style="height:5px; border-radius:1px; background:var(--line)"></div>
            </div>
          </div>
          <div style="position:absolute; inset:0; background:var(--navy); border:2px solid var(--navy); border-radius:5px; transform:rotateY(180deg); backface-visibility:hidden; display:flex; align-items:center; justify-content:center">
            <div style="width:15px; height:15px; border:2px solid var(--cream); border-radius:50%; position:relative">
              <div style="position:absolute; left:6px; top:2px; width:1px; height:5px; background:var(--cream); border-radius:0.5px"></div>
              <div style="position:absolute; left:7px; top:6px; width:5px; height:1px; background:var(--cream); border-radius:0.5px"></div>
            </div>
          </div>
        </div>
      </div>

      <div style="position:relative; width:50px; height:54px; transform-origin:bottom center; animation:housePulse var(--dur) infinite cubic-bezier(.4,0,.2,1); animation-delay:calc(var(--dur) * 0.26)">
        <div style="position:absolute; left:0; top:0; width:50px; height:14px; background:var(--navy); clip-path:polygon(50% 0, 100% 100%, 0 100%)"></div>
        <div style="position:absolute; left:5px; top:13px; right:5px; bottom:0; background:var(--mid); border-radius:2px 2px 3px 3px; display:flex; align-items:flex-start; justify-content:center; gap:3px; padding-top:6px">
          <div style="width:8px; height:8px; background:var(--line); border-radius:0.5px; animation:windowOn var(--dur) infinite steps(1,end); animation-delay:calc(var(--dur) * 0.26)"></div>
          <div style="width:8px; height:8px; background:var(--line); border-radius:0.5px; animation:windowOn var(--dur) infinite steps(1,end); animation-delay:calc(var(--dur) * 0.26 + 0.18s)"></div>
          <div style="width:8px; height:8px; background:var(--line); border-radius:0.5px; animation:windowOn var(--dur) infinite steps(1,end); animation-delay:calc(var(--dur) * 0.26 + 0.36s)"></div>
        </div>
        <div style="position:absolute; left:50%; margin-left:-6px; bottom:0; width:12px; height:15px; background:var(--aqua); border-radius:6px 6px 0 0"></div>
      </div>

      <div style="position:relative; width:29px; height:51px">
        <div style="position:absolute; left:0; bottom:0; width:29px; height:44px">
          <div style="position:absolute; left:14px; bottom:19px; width:2px; height:37px; background:var(--navy); border-radius:1px; transform-origin:bottom center; animation:stir var(--dur) infinite cubic-bezier(.4,0,.2,1); animation-delay:calc(var(--dur) * 0.38)"></div>
          <div style="position:absolute; left:0; top:8px; width:29px; height:7px; background:var(--cream); border-radius:3px"></div>
          <div style="position:absolute; left:2px; top:15px; width:25px; bottom:0; background:#7eb8d8; clip-path:polygon(0 0, 100% 0, 87% 100%, 13% 100%); overflow:hidden">
            <div style="position:absolute; left:-3px; right:-3px; top:7px; height:6px; background:#f0f8ff; opacity:.85; animation:swirl var(--dur) infinite ease-in-out; animation-delay:calc(var(--dur) * 0.38)"></div>
          </div>
        </div>
      </div>

      <div style="position:relative; width:37px; height:45px; transform-origin:bottom center; animation:bagHop var(--dur) infinite cubic-bezier(.34,1.3,.64,1); animation-delay:calc(var(--dur) * 0.44)">
        <div style="position:absolute; left:8px; top:0; width:8px; height:13px; border:2px solid var(--mid); border-bottom:none; border-radius:5px 5px 0 0; transform-origin:bottom center; animation:strapSway var(--dur) infinite ease-in-out; animation-delay:calc(var(--dur) * 0.44)"></div>
        <div style="position:absolute; right:8px; top:0; width:8px; height:13px; border:2px solid var(--mid); border-bottom:none; border-radius:5px 5px 0 0; transform-origin:bottom center; animation:strapSway var(--dur) infinite ease-in-out; animation-delay:calc(var(--dur) * 0.44 + 0.08s)"></div>
        <div style="position:absolute; left:0; right:0; bottom:0; height:32px; background:var(--navy); border-radius:10px 10px 3px 3px"></div>
        <div style="position:absolute; left:0; right:0; bottom:12px; height:12px; background:var(--aqua); border-radius:0 0 5px 5px"></div>
        <div style="position:absolute; left:50%; margin-left:-4px; bottom:15px; width:7px; height:5px; background:var(--cream); border-radius:1px"></div>
      </div>
    </div>

    <div style="text-align:center; color:var(--body)">
      <p style="margin:0 0 6px; font-size:16px; font-weight:700; letter-spacing:.14em; color:var(--navy)">校園攻略站</p>
      <p style="margin:0; font-size:12px; letter-spacing:.05em; color:var(--muted)">正在為你探路<span id="loader-dots"></span></p>
    </div>
  </div>
</div>

<script>
  (function() {
    const dots = document.getElementById('loader-dots');
    if (dots) {
      let count = 0;
      setInterval(() => {
        dots.textContent = '.'.repeat(count % 4);
        count++;
      }, 350);
    }
  })();
  function hideLoader() {
    const loader = document.getElementById('campus-guide-loader');
    if (loader) {
      loader.style.opacity = '0';
      loader.style.pointerEvents = 'none';
      loader.style.transition = 'opacity 0.3s ease-out';
      setTimeout(() => loader.remove(), 300);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', hideLoader);
    window.addEventListener('load', hideLoader);
  } else {
    hideLoader();
  }
</script>
