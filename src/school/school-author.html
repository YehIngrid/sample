    .au-container { width: min(860px, 92vw); margin: 32px auto 80px; }
    .au-skeleton { display: flex; flex-direction: column; gap: 16px; }
    .au-header { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px; display: flex; gap: 22px; align-items: center; margin-bottom: 24px; }
    .au-avatar { width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(135deg, var(--mid), var(--aqua)); border: 2px solid #fff; box-shadow: 0 0 0 1.5px var(--aqua); flex-shrink: 0; object-fit: cover; }

    .au-name { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .au-status { font-size: 11.5px; font-weight: 700; color: var(--navy); background: var(--alice); padding: 3px 10px; border-radius: 999px; letter-spacing: 0.04em; }

    .au-header .follow { align-self: center; }

    .au-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 24px; }
    .au-stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; text-align: center; }
    .au-stat-val { font-size: 22px; font-weight: 700; color: var(--navy); }
    .au-stat-lbl { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: 0.03em; }

    .au-section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; margin-bottom: 20px; }
    .au-section-head { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .au-edu-row { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
    .au-edu-row:first-of-type { border-top: none; }
    .au-edu-type { color: var(--navy); font-weight: 700; flex-shrink: 0; }
    .au-edu-school { color: var(--ink); text-align: right; }
    .au-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 10px 0; }

    .pill-soon { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; color: #a08540; background: rgba(243,227,181,0.55); padding: 5px 12px; border-radius: 999px; letter-spacing: 0.04em; flex-shrink: 0; margin-left: 8px; }
    .au-soon-body { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 18px 6px 4px; color: var(--muted); }
    .au-soon-body svg { width: 34px; height: 34px; color: var(--sky); flex-shrink: 0; }
    .au-soon-body p { margin: 0; font-size: 12.5px; line-height: 1.7; max-width: 420px; }

    @media (max-width: 560px) {
      .au-header { flex-direction: column; text-align: center; padding: 24px 20px; }
      .au-header .follow { width: 100%; }
      .au-counts { justify-content: center; }
    }
    :root[data-theme="dark"] .au-status { color: var(--cream); }
  </style>

<script type="module">
import { AppModal } from "../default/app-modal.js";
import { requireAdminPage } from "../default/default.js";
import SchoolBackendService from "./schoolBackendService.js";
window.AppModal = AppModal;
window.schoolBackendService = new SchoolBackendService();
(async () => {
  // 跟其他 /school 頁面一致：整個校園攻略站目前還在 MODERATOR/ADMIN 限定的
  // 內測階段，這裡沒有理由放寬，不然就是這個頁面獨漏的安全性不一致。
  const ok = await requireAdminPage();
  if (ok) document.body.style.visibility = "visible";
})();
</script>
<script defer src="school-new.js"></script>
<script defer src="school-cart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  // ── 手機版漢堡選單 ──
  var hamburger = document.querySelector('.mobile-hamburger');
  var menuWrapper = document.getElementById('navbarMenu');
  var backdrop = document.querySelector('.mobile-menu-backdrop');
  var menuLinks = document.querySelectorAll('.mobile-menu a');
  function toggleMenu() { menuWrapper.classList.toggle('show'); backdrop.classList.toggle('active'); hamburger.classList.toggle('active'); }
  function closeMenu() { menuWrapper.classList.remove('show'); backdrop.classList.remove('active'); hamburger.classList.remove('active'); }
  if (hamburger) hamburger.addEventListener('click', toggleMenu);
  if (backdrop) backdrop.addEventListener('click', closeMenu);
  menuLinks.forEach(function (link) { link.addEventListener('click', closeMenu); });

  var STATUS_LABEL = { ENROLLED: '在學', TRANSFERRING: '轉學', GRADUATED: '畢業', DROPPED_OUT: '肄業', ON_LEAVE: '休學' };
  var EDU_TYPE_LABEL = { TRANSFER_SCHOOL: '轉校', TRANSFER_MAJOR: '轉系', DOUBLE_MAJOR: '雙主修', MINOR: '輔系', EXCHANGE: '交換生', OTHER: '其他' };

  function $(id) { return document.getElementById(id); }

  async function load() {
    var accountId = new URLSearchParams(window.location.search).get('id');
    if (!accountId) { $('auSkeleton').style.display = 'none'; $('auNotFound').style.display = ''; return; }

    try {
      var res = await window.schoolBackendService.getAuthorProfile(accountId);
      var data = res.data;

      var displayName = formatSemiRealName(data.displayName || '匿名作者');
      $('auAvatar').src = data.avatarUrl || '../image/default-avatar.webp';
      $('auName').textContent = displayName;
      document.title = displayName + ' 的作者主頁 · 校園攻略站';

      var statusEl = $('auStatus');
      if (data.studentStatus && STATUS_LABEL[data.studentStatus]) {
        statusEl.textContent = STATUS_LABEL[data.studentStatus];
        statusEl.style.display = '';
      }

      $('auFollowers').textContent = (data.followerCount || 0).toLocaleString();
      $('auFollowing').textContent = (data.followingCount || 0).toLocaleString();
      $('auArticleCount').textContent = (data.articleCount || 0).toLocaleString();
      $('auLikeCount').textContent = (data.totalLikeCount || 0).toLocaleString();

      var titlesEl = $('auTitles');
      (data.titles || []).forEach(function (t) {
        var span = document.createElement('span');
        span.className = 't';
        span.textContent = t.shortName || t.name || '';
        titlesEl.appendChild(span);
      });

      var eduListEl = $('auEduList');
      if ((data.educationRecords || []).length) {
        eduListEl.innerHTML = '';
        data.educationRecords.forEach(function (rec) {
          var row = document.createElement('div');
          row.className = 'au-edu-row';
          var typeEl = document.createElement('span');
          typeEl.className = 'au-edu-type';
          typeEl.textContent = EDU_TYPE_LABEL[rec.type] || rec.type;
          var schoolEl = document.createElement('span');
          schoolEl.className = 'au-edu-school';
          schoolEl.textContent = [rec.schoolName, rec.department].filter(Boolean).join(' ‧ ');
          row.appendChild(typeEl);
          row.appendChild(schoolEl);
          eduListEl.appendChild(row);
        });
      }

      // 本人瀏覽自己的作者主頁：不需要追蹤自己
      var followBtn = $('auFollowBtn');
      var isOwner = localStorage.getItem('uid') === String(accountId);
      if (isOwner) {
        followBtn.style.display = 'none';
      } else {
        var following = !!data.isFollowing;
        var paintFollow = function () {
          followBtn.textContent = following ? '✓ 已追蹤' : '＋ 追蹤';
          followBtn.classList.toggle('on', following);
        };
        paintFollow();
        followBtn.addEventListener('click', function (e) {
          e.preventDefault();
          var action = following
            ? window.schoolBackendService.unfollowAuthor(accountId)
            : window.schoolBackendService.followAuthor(accountId);
          action.then(function () { following = !following; paintFollow(); })
            .catch(function (err) { console.error('追蹤失敗：', err); });
        });
      }

      $('auSkeleton').style.display = 'none';
      $('auContent').style.display = '';
    } catch (error) {
      console.error('載入作者主頁失敗：', error);
      $('auSkeleton').style.display = 'none';
      $('auNotFound').style.display = '';
    }
  }

  load();
});
</script>
